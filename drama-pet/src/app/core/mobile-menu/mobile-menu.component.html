<div class="mobile-menu" [class.open]="isOpen" (click)="closeMenu()">
  <div class="mobile-menu__overlay"></div>

  <div class="mobile-menu__panel" (click)="$event.stopPropagation()">
    <div class="mobile-menu__header">
      <span class="mobile-menu__logo">DRAMA PET</span>
      <button
        class="mobile-menu__close"
        (click)="closeMenu()"
        aria-label="Cerrar men\u00fa"
      >
        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>

    <nav class="mobile-menu__nav">
      <ul class="mobile-menu__links">
        @for (link of navLinks; track link.route) {
          <li>
            <a
              [routerLink]="link.route"
              class="mobile-menu__link"
              (click)="onLinkClick()"
            >
              {{ link.label }}
            </a>
          </li>
        }
      </ul>

      <a
        routerLink="/reservar"
        class="mobile-menu__cta"
        (click)="onLinkClick()"
      >
        Reservar cita
      </a>

      <a
        href="tel:+51999888777"
        class="mobile-menu__emergency"
        (click)="onLinkClick()"
      >
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path>
        </svg>
        Emergencias 24h
      </a>
    </nav>
  </div>
</div>
