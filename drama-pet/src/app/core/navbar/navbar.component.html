<nav class="navbar" [class.scrolled]="isScrolled()">
  <div class="navbar__container">
    <a routerLink="/" class="navbar__logo">
      <span class="navbar__logo-text">DRAMA PET</span>
    </a>

    <ul class="navbar__links">
      @for (link of navLinks; track link.route) {
        <li>
          <a [routerLink]="link.route" class="navbar__link">{{ link.label }}</a>
        </li>
      }
    </ul>

    <a routerLink="/reservar" class="navbar__cta">Reservar cita</a>

    <button
      class="navbar__hamburger"
      [class.navbar__hamburger--open]="isMobileMenuOpen()"
      (click)="toggleMobileMenu()"
      [attr.aria-expanded]="isMobileMenuOpen()"
      aria-label="Abrir menú de navegación"
    >
      <span class="navbar__hamburger-line"></span>
      <span class="navbar__hamburger-line"></span>
      <span class="navbar__hamburger-line"></span>
    </button>
  </div>
</nav>

<app-mobile-menu
  [isOpen]="isMobileMenuOpen()"
  (close)="closeMobileMenu()"
></app-mobile-menu>
