<div class="date-step">
  <div class="date-step__header">
    <h2 class="date-step__title">Fecha y hora</h2>
    <p class="date-step__subtitle">Selecciona el dia y la hora de tu visita.</p>
  </div>

  <div class="date-step__section">
    <h3 class="date-step__section-title">Dia</h3>
    <div class="date-step__days">
      <button
        class="date-step__day"
        *ngFor="let day of days"
        [class.date-step__day--selected]="selectedDate === day.label"
        [class.date-step__day--today]="isToday(day)"
        (click)="selectDate(day)"
        type="button"
      >
        <span class="date-step__day-name">{{ day.dayName }}</span>
        <span class="date-step__day-number">{{ day.dayNumber }}</span>
        <span class="date-step__day-month">{{ day.monthName }}</span>
      </button>
    </div>
  </div>

  <div class="date-step__section" *ngIf="selectedDate">
    <h3 class="date-step__section-title">Hora</h3>
    <div class="date-step__time-grid" *ngIf="getAvailableSlots().length > 0">
      <button
        class="date-step__time"
        *ngFor="let slot of getAvailableSlots()"
        [class.date-step__time--selected]="selectedTime === slot.time"
        [class.date-step__time--unavailable]="!slot.available"
        [disabled]="!slot.available"
        (click)="selectTime(slot.time)"
        type="button"
      >
        {{ slot.time }}
      </button>
    </div>
    <div class="date-step__no-slots" *ngIf="getAvailableSlots().length === 0">
      <p>No hay horarios disponibles para este dia.</p>
    </div>
  </div>

  <div class="date-step__no-date" *ngIf="!selectedDate">
    <div class="date-step__no-date-icon">
      <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
        <line x1="16" y1="2" x2="16" y2="6"/>
        <line x1="8" y1="2" x2="8" y2="6"/>
        <line x1="3" y1="10" x2="21" y2="10"/>
      </svg>
    </div>
    <p class="date-step__no-date-text">Selecciona un dia para ver los horarios disponibles.</p>
  </div>
</div>
