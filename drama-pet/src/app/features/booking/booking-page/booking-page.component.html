<div class="booking-page" *ngIf="!isBookingConfirmed()">
  <div class="booking-page__container">
    <div class="booking-page__main">
      <header class="booking-page__header">
        <a class="booking-page__back" routerLink="/">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="19" y1="12" x2="5" y2="12"/>
            <polyline points="12 19 5 12 12 5"/>
          </svg>
          Volver
        </a>
        <h1 class="booking-page__title">Reservar cita</h1>
      </header>

      <nav class="booking-page__steps">
        <button
          class="booking-page__step"
          *ngFor="let step of [1, 2, 3, 4, 5, 6]"
          [class.booking-page__step--completed]="isStepCompleted(step)"
          [class.booking-page__step--active]="isStepActive(step)"
          [class.booking-page__step--future]="step > maxStep() + 1"
          (click)="goToStep(step)"
          [disabled]="step > maxStep() + 1"
          type="button"
        >
          <span class="booking-page__step-number">
            <svg *ngIf="isStepCompleted(step)" xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="20 6 9 17 4 12"/>
            </svg>
            <span *ngIf="!isStepCompleted(step)">{{ step }}</span>
          </span>
          <span class="booking-page__step-label">{{ getStepLabel(step) }}</span>
        </button>
      </nav>

      <div class="booking-page__content">
        <div class="booking-page__step-content" *ngIf="currentStep() === 1">
          <app-pet-step
            [selectedPetId]="selectedPet()?.id || ''"
            (petSelected)="onPetSelected($event)"
          ></app-pet-step>
        </div>

        <div class="booking-page__step-content" *ngIf="currentStep() === 2">
          <app-service-step
            [selectedServiceId]="selectedService()?.id || ''"
            (serviceSelected)="onServiceSelected($event)"
          ></app-service-step>
        </div>

        <div class="booking-page__step-content" *ngIf="currentStep() === 3">
          <app-questions-step
            [selectedService]="selectedService()"
            [questionsAnswers]="questionsAnswers()"
            (answersChanged)="onQuestionsChanged($event)"
          ></app-questions-step>
        </div>

        <div class="booking-page__step-content" *ngIf="currentStep() === 4">
          <app-vet-step
            [selectedVetId]="selectedVet()?.id || ''"
            (vetSelected)="onVetSelected($event)"
          ></app-vet-step>
        </div>

        <div class="booking-page__step-content" *ngIf="currentStep() === 5">
          <app-date-step
            [selectedDate]="selectedDate()"
            [selectedTime]="selectedTime()"
            (dateSelected)="onDateSelected($event)"
            (timeSelected)="onTimeSelected($event)"
          ></app-date-step>
        </div>

        <div class="booking-page__step-content" *ngIf="currentStep() === 6">
          <app-review-step
            [pet]="selectedPet()"
            [service]="selectedService()"
            [vet]="selectedVet()"
            [selectedDate]="selectedDate()"
            [selectedTime]="selectedTime()"
            [ownerData]="ownerData()"
            (confirmBooking)="onConfirmBooking($event)"
            (ownerDataChanged)="onOwnerDataChanged($event)"
          ></app-review-step>
        </div>
      </div>

      <div class="booking-page__navigation">
        <button
          class="booking-page__nav-btn booking-page__nav-btn--prev"
          *ngIf="currentStep() > 1"
          (click)="prevStep()"
          type="button"
        >
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="19" y1="12" x2="5" y2="12"/>
            <polyline points="12 19 5 12 12 5"/>
          </svg>
          Atrás
        </button>
        <div class="booking-page__nav-spacer" *ngIf="currentStep() === 1"></div>

        <button
          class="booking-page__nav-btn booking-page__nav-btn--next"
          *ngIf="currentStep() < 6"
          [disabled]="!canGoNext()"
          (click)="nextStep()"
          type="button"
        >
          Siguiente
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="5" y1="12" x2="19" y2="12"/>
            <polyline points="12 5 19 12 12 19"/>
          </svg>
        </button>
      </div>
    </div>

    <aside class="booking-page__sidebar">
      <app-booking-summary
        [pet]="selectedPet()"
        [service]="selectedService()"
        [vet]="selectedVet()"
        [selectedDate]="selectedDate()"
        [selectedTime]="selectedTime()"
        [currentStep]="currentStep()"
      ></app-booking-summary>
    </aside>
  </div>
</div>

<app-booking-success
  *ngIf="isBookingConfirmed()"
  [pet]="selectedPet()"
  [service]="selectedService()"
  [vet]="selectedVet()"
  [selectedDate]="selectedDate()"
  [selectedTime]="selectedTime()"
  [ownerData]="ownerData()"
></app-booking-success>
