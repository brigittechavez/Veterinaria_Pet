<section class="hero">
  <div class="hero__container container">
    <div class="hero__content">
      <h1 class="hero__headline">
        Menos drama.<br>Más cuidado.
      </h1>
      <p class="hero__description">
        Cuidamos perros y gatos con atención cercana, profesionales que sí escuchan
        y una experiencia pensada también para sus humanos.
      </p>
      <div class="hero__actions">
        <app-button variant="primary" size="lg" routerLink="/reservar">
          Reservar cita
        </app-button>
        <app-button variant="secondary" size="lg" routerLink="/servicios">
          Ver servicios
        </app-button>
      </div>
    </div>
    <div class="hero__visual">
      <div class="hero__circle"></div>
      <img
        class="hero__pet-image"
        src="assets/images/hero-pet.png"
        alt="Mascota feliz atendida en Drama Pet"
        width="500"
        height="500"
        loading="eager"
      >

  </div>
