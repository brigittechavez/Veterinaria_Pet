<article class="team-card">
  <div class="team-card__photo">
    <div class="team-card__photo-shape"></div>
    <span class="team-card__photo-initials">{{ vet.name.charAt(0) }}{{ vet.name.split(' ').pop()?.charAt(0) }}</span>
  </div>

  <div class="team-card__info">
    <h3 class="team-card__name">{{ vet.name }}</h3>
    <span class="team-card__specialty">{{ vet.specialty }}</span>
    <span class="team-card__experience">{{ vet.experience }}</span>
    <p class="team-card__fun-fact">"{{ vet.funFact }}"</p>
  </div>
</article>
